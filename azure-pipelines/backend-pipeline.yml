trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - server/**

variables:
  - group: cloudproj-variables
  - name: imageTag
    value: $(Build.BuildId)

stages:
  - stage: Build
    displayName: 'Build and Push Docker Image'
    jobs:
      - job: BuildJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Build and Push Backend Image via Azure CLI'
            inputs:
              azureSubscription: $(AZURE_SUBSCRIPTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                # Azure Container Registry mein login
                az acr login --name $(DOCKER_REGISTRY)
                
                # Image build karna sahi context aur Dockerfile path ke sath
                docker build -f server/Dockerfile -t $(DOCKER_REGISTRY)/$(BACKEND_IMAGE_NAME):$(imageTag) ./server
                docker build -f server/Dockerfile -t $(DOCKER_REGISTRY)/$(BACKEND_IMAGE_NAME):latest ./server
                
                # Images ko ACR mein push karna
                docker push $(DOCKER_REGISTRY)/$(BACKEND_IMAGE_NAME):$(imageTag)
                docker push $(DOCKER_REGISTRY)/$(BACKEND_IMAGE_NAME):latest

  - stage: DeployProd
    displayName: 'Deploy to Production'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProdJob
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy Backend to Prod'
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    appName: $(BACKEND_APP_NAME)
                    containers: $(DOCKER_REGISTRY)/$(BACKEND_IMAGE_NAME):$(imageTag)