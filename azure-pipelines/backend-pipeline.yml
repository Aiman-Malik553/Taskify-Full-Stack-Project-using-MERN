trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - server/**

variables:
  - group: cloudproj-variables
  - name: imageTag
    value: $(Build.BuildId)

stages:
  - stage: Build
    displayName: 'Build and Push Docker Image'
    jobs:
      - job: BuildJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          # Native Docker task directly using service connection to bypass spelling mistakes
          - task: Docker@2
            displayName: 'Build and Push Backend Image to ACR'
            inputs:
              containerRegistry: 'acr-service-connection'
              repository: $(BACKEND_IMAGE_NAME)
              command: 'buildAndPush'
              Dockerfile: 'server/Dockerfile'
              buildContext: '$(Build.SourcesDirectory)/server'
              tags: |
                $(imageTag)
                latest

  - stage: DeployProd
    displayName: 'Deploy to Production'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProdJob
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy Backend to Prod'
                  inputs:
                    azureSubscription: $(AZURE_SUBSCRIPTION)
                    appName: $(BACKEND_APP_NAME)
                    containers: 'acrcloudpjrojaiman.azurecr.io/$(BACKEND_IMAGE_NAME):$(imageTag)'