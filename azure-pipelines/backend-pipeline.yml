trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - server/**

variables:
  - group: cloudproj-variables              # ✅ Variable group linked
  - name: imageTag
    value: $(Build.BuildId)

stages:
  - stage: Build
    displayName: 'Build and Push Docker Image'
    jobs:
      - job: BuildJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: 'acr-service-connection'

          - task: Docker@2
            displayName: 'Build Backend Image'
            inputs:
              command: build
              repository: '$(DOCKER_REGISTRY)/$(BACKEND_IMAGE_NAME)'
              dockerfile: 'server/Dockerfile'
              buildContext: 'server/'
              tags: |
                $(imageTag)
                latest

          - task: Docker@2
            displayName: 'Push Backend Image to ACR'
            inputs:
              command: push
              repository: '$(DOCKER_REGISTRY)/$(BACKEND_IMAGE_NAME)'
              tags: |
                $(imageTag)
                latest

  - stage: DeployProd
    displayName: 'Deploy to Production'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProdJob
        environment: 'production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: 'Deploy Backend to Prod'
                  inputs:
                    azureSubscription: '$(AZURE_SUBSCRIPTION)'   # ✅ Variable se
                    appName: '$(BACKEND_APP_NAME)'               # ✅ Variable se
                    containers: '$(DOCKER_REGISTRY)/$(BACKEND_IMAGE_NAME):$(imageTag)'